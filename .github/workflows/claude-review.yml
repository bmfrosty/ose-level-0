name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude PR Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # track_progress loads the GitHub MCP server that provides the
          # comment-posting tools and creates a tracking comment on the PR.
          track_progress: true
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for an OSE (Old-School Essentials) character generator.
            The codebase is vanilla JavaScript/HTML/CSS — no framework.

            Focus on:
            - JavaScript bugs, logic errors, and off-by-one mistakes
            - Data consistency: race vs. class separation (Basic mode race-as-class vs.
              Advanced mode separate race+class), correct level ranges (availableAt /
              availableThrough), and correct mode flags (basicMode, advancedMode)
            - CSS print layout issues (margin, page-break, box-sizing)
            - Anything that could cause a character sheet or class print page to render
              incorrectly or overflow a page

            Skip style nits (indentation, naming) unless they cause a real bug.

            Do NOT post inline/line comments. Summarize all findings in your final
            response, referencing file paths and line numbers in the text — this becomes
            the PR comment. Do not ask for input — review directly.

      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-log-pr${{ github.event.pull_request.number }}-run${{ github.run_number }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 14
